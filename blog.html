<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Inkwell</title>
  <meta name="description" content="Browse every article on Inkwell: design, development, productivity, lifestyle and tech.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="js/tw-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="blog" class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 font-sans antialiased">
  <div id="site-header"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Page header -->
    <section class="pt-12 md:pt-20 pb-10 text-center">
      <p class="text-sm font-semibold uppercase tracking-wider text-brand-600 dark:text-brand-400">The Journal</p>
      <h1 class="mt-3 font-serif text-4xl md:text-6xl font-semibold tracking-tight text-slate-900 dark:text-white">All articles</h1>
      <p class="mt-4 max-w-xl mx-auto text-lg text-slate-600 dark:text-slate-400">Search, filter and dive into everything we've written.</p>

      <div class="mt-10 max-w-xl mx-auto relative">
        <svg class="w-5 h-5 absolute left-5 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Search articles, topics, tags…" aria-label="Search articles"
          class="w-full pl-14 pr-5 py-4 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-soft focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-100 placeholder-slate-400">
      </div>
    </section>

    <!-- Filters -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-10">
      <div id="category-filters" class="flex flex-wrap justify-center gap-2"></div>
      <p id="result-count" class="text-sm text-slate-500 dark:text-slate-400"></p>
    </div>

    <!-- Grid -->
    <div id="blog-grid" class="grid gap-8 sm:grid-cols-2 lg:grid-cols-3"></div>

    <!-- Empty -->
    <div id="empty-state" class="hidden text-center py-20">
      <p class="text-5xl">🔍</p>
      <h2 class="mt-4 text-xl font-bold text-slate-900 dark:text-white">No articles found</h2>
      <p class="mt-2 text-slate-600 dark:text-slate-400">Try a different keyword or category.</p>
      <button id="reset-filters" class="mt-6 px-6 py-3 rounded-full bg-brand-600 text-white font-semibold hover:bg-brand-700">Reset filters</button>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/posts.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
